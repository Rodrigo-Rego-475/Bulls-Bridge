<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCKED // ZenFocus Active Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121316;
      color: #EFEAE1;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .card {
      background: #18191E;
      border: 1px solid rgba(229, 169, 60, 0.4);
      border-radius: 12px;
      max-width: 540px;
      width: 100%;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 0 40px -10px rgba(229, 169, 60, 0.25);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #D95C51, #E5A93C, #4EAA79);
    }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      background: rgba(217, 92, 81, 0.15);
      color: #D95C51;
      border: 1px solid rgba(217, 92, 81, 0.3);
      margin-bottom: 20px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(229, 169, 60, 0.1);
      border: 1px solid rgba(229, 169, 60, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E5A93C;
    }
    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #EFEAE1;
      margin-bottom: 8px;
    }
    .domain {
      color: #E5A93C;
      word-break: break-all;
    }
    p {
      font-size: 13px;
      color: #948D80;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .meta-box {
      background: #121316;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #D9CDB8;
      text-align: left;
      margin-bottom: 28px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }
    .meta-label {
      color: #948D80;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: #D95C51;
      color: #121316;
      border: 1px solid #D95C51;
    }
    .btn-primary:hover {
      background: #ea6b60;
    }
    .btn-secondary {
      background: #1F2127;
      color: #EFEAE1;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: #282B33;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">ZEN SHIELD INTERCEPTION</div>
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>WINDOW ACCESS LOCKED</h1>
    <p>
      Navigation to <span class="domain" id="domainSpan">this website</span> was blocked because your active focus timer is currently running.
    </p>

    <div class="meta-box">
      <div class="meta-row">
        <span class="meta-label">FOCUS POLICY:</span>
        <span id="modeSpan">ACTIVE ZEN SESSION</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">DIRECTIVE:</span>
        <span id="subjectSpan">DEEP FOCUS IN PROGRESS</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">ENFORCEMENT:</span>
        <span style="color:#D95C51;">WINDOW LOCKED</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.close()">
        Close This Window
      </button>
      <a href="http://localhost:5173" class="btn btn-secondary">
        Return to Focus Runner
      </a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const domain = params.get('domain') || params.get('blocked_domain') || 'blacklisted site';
    document.getElementById('domainSpan').textContent = domain;

    // Fetch session details from local server
    fetch('http://localhost:3001/api/session-state')
      .then(res => res.json())
      .then(data => {
        if (data.mode) {
          document.getElementById('modeSpan').textContent = data.mode + ' MODE';
        }
        if (data.subject_summary) {
          document.getElementById('subjectSpan').textContent = data.subject_summary;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
