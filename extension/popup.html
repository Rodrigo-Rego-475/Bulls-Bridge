<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #121316;
      color: #EFEAE1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 12px;
      font-weight: bold;
      color: #E5A93C;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      text-transform: uppercase;
    }
    .active {
      background: rgba(78, 170, 121, 0.2);
      color: #4EAA79;
      border: 1px solid rgba(78, 170, 121, 0.4);
    }
    .inactive {
      background: rgba(255, 255, 255, 0.05);
      color: #948D80;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .info {
      font-size: 11px;
      color: #D9CDB8;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .domains {
      max-height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      color: #948D80;
      background: #18191E;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .domain-item {
      padding: 2px 0;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 10px;
      padding: 6px 0;
      background: #1F2127;
      color: #E5A93C;
      border: 1px solid rgba(229, 169, 60, 0.3);
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #282B33;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">ZENFOCUS // SHIELD</div>
    <div id="statusBadge" class="badge inactive">STANDBY</div>
  </div>
  <div id="statusText" class="info">Connecting to local ZenFocus session runner...</div>
  <div id="domainContainer" style="display:none;">
    <div style="font-size:10px; font-family:monospace; color:#EFEAE1; margin-bottom:4px;">ACTIVELY BLOCKED SITES:</div>
    <div id="domainList" class="domains"></div>
  </div>
  <a href="http://localhost:5173" target="_blank" class="btn">Open ZenFocus App</a>
  <script src="popup.js"></script>
</body>
</html>
